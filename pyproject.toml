[project]
name = "eclipsectl-cli"
version = "0.1.0"
description = "MCP server for controlling Eclipse IDE - refactoring, LSP features, and file operations"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "eclipsectl-cli Contributors", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.urls]
"Homepage" = "https://github.com/Metherlance/eclipsectl-cli"
"Bug Tracker" = "https://github.com/Metherlance/eclipsectl-cli/issues"

[project.scripts]
# eclipse command is provided by bin/eclipse bash script (fast, ~25ms)
# All MCP tools are accessible via the bash CLI + daemon architecture
eclipsectl-cli = "eclipsectl_cli:cli_entry_point"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

# bash CLI script installed via: ln -sf $(pwd)/bin/eclipse /usr/local/bin/eclipse

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = "my-venv .venv venv env"
markers = [
    "unit: fast unit tests with mocks",
    "integration: tests requiring Eclipse IDE running",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
