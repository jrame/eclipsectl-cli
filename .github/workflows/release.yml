name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/eclipsectl-linux-x86_64
          cp target/release/eclipsectl install.sh README.md CLI_USAGE.md DAEMON.md LICENSE config.example.toml dist/eclipsectl-linux-x86_64/
          mkdir -p dist/eclipsectl-linux-x86_64/docs
          cp docs/COMMANDS.md docs/VALIDATION.md docs/VALIDATION_RESULTS.md dist/eclipsectl-linux-x86_64/docs/
          tar -czf dist/eclipsectl-linux-x86_64.tar.gz -C dist eclipsectl-linux-x86_64
          cd dist
          sha256sum eclipsectl-linux-x86_64.tar.gz > eclipsectl-linux-x86_64.tar.gz.sha256
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/eclipsectl-windows-x86_64 | Out-Null
          Copy-Item target/release/eclipsectl.exe,install.ps1,README.md,CLI_USAGE.md,DAEMON.md,LICENSE,config.example.toml dist/eclipsectl-windows-x86_64/
          New-Item -ItemType Directory -Force dist/eclipsectl-windows-x86_64/docs | Out-Null
          Copy-Item docs/COMMANDS.md,docs/VALIDATION.md,docs/VALIDATION_RESULTS.md dist/eclipsectl-windows-x86_64/docs/
          Compress-Archive -Path dist/eclipsectl-windows-x86_64 -DestinationPath dist/eclipsectl-windows-x86_64.zip
          $hash = (Get-FileHash dist/eclipsectl-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  eclipsectl-windows-x86_64.zip" | Set-Content dist/eclipsectl-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: eclipsectl-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
